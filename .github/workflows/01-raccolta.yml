name: "Cheffino 01 - Raccolta fonti"
# Ogni lunedì e giovedì all'alba (ora italiana) raccoglie fino a 10 ricette nuove.
# Restano in revisione: le completano i controlli giornalieri (02) e le pubblica
# il workflow 03 (mercoledì e venerdì) solo se superano tutte le verifiche.
on:
  schedule:
    - cron: '40 4 * * 1,4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cheffino-catalogo-scrittura
  cancel-in-progress: false
jobs:
  raccolta:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquisisci nuove ricette (sempre in revisione)
        run: |
          python aggiorna_catalogo.py --limit 10 --delay 2.5
          python normalizza_catalogo.py
          python classifica_catalogo.py
          python -m json.tool data/catalogo.json > /dev/null
      - name: Salva catalogo in lavorazione
        run: |
          if git diff --quiet -- data/catalogo.json data/catalogo_pubblicato.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalogo.json data/catalogo_pubblicato.json
          git commit -m 'Catalogo in lavorazione: nuove fonti'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
