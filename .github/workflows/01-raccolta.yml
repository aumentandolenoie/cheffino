name: "Cheffino 01 - Raccolta fonti"
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cheffino-catalogo-scrittura
  cancel-in-progress: false
jobs:
  raccolta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquisisci nuove ricette (sempre in revisione)
        run: |
          python aggiorna_catalogo.py --limit 10 --delay 2.5
          python -m json.tool data/catalogo.json > /dev/null
      - name: Salva catalogo in lavorazione
        run: |
          if git diff --quiet -- data/catalogo.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalogo.json
          git commit -m 'Catalogo in lavorazione: nuove fonti'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
