name: "Cheffino 04 - Audit ricette con le fonti"
# Sola lettura: confronta le ricette pubblicate con la pagina originale
# (titolo, ingredienti, procedimento, porzioni, copertina). Non scrive nulla.
on:
  workflow_dispatch:
    inputs:
      limite:
        description: 'Numero massimo di ricette da confrontare'
        default: '200'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confronto con le fonti
        run: python audit_ricette.py --only-published --online --limit "${{ inputs.limite }}" --delay 2 --report /tmp/audit-fonti.json
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: audit-fonti
          path: /tmp/audit-fonti.json
          retention-days: 5
