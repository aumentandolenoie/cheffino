name: "Cheffino 07 - Completa ricette storiche pubblicate"
on:
  push:
    paths:
      - '.github/workflows/07-ripristina-passaggi.yml'
      - 'ripristina_passaggi_storici.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cheffino-catalogo-scrittura
  cancel-in-progress: false
jobs:
  recupero:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controlla regressioni prima di toccare i dati
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q
          cp data/catalogo_pubblicato.json /tmp/snapshot_prima_del_recupero.json
      - name: Recupera solo procedure originali e foto con abbinamento verificabile
        run: |
          python ripristina_passaggi_storici.py --apply
          python controlla_integrita_catalogo.py
          python -m json.tool data/catalogo.json >/dev/null
          python -m json.tool data/catalogo_pubblicato.json >/dev/null
          python verifica_snapshot.py --previous /tmp/snapshot_prima_del_recupero.json
          python diagnostica_foto_api.py
      - name: Salva le sole correzioni verificate
        run: |
          if git diff --quiet -- data/catalogo.json data/catalogo_pubblicato.json; then
            echo 'Nessuna ulteriore ricetta recuperabile in sicurezza.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalogo.json data/catalogo_pubblicato.json
          git commit -m 'Catalogo: ripristina testi e foto originali delle ricette storiche'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
