name: "Cheffino 08 - Ultime foto e assenza verificata"
on:
  push:
    paths:
      - '.github/workflows/08-completa-ultime-foto.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cheffino-catalogo-scrittura
  cancel-in-progress: false
jobs:
  completa:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test di regressione e backup snapshot
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q
          cp data/catalogo_pubblicato.json /tmp/cheffino_snap_pre_recupero.json
      - name: Recupera due ricette con foto originali
        run: python recupera_due_ricette_residue.py --apply
      - name: Certifica assenza solo dove la fonte lo dimostra
        run: python certifica_assenza_foto_fonte.py --apply
      - name: Verifica cataloghi prima di salvare
        run: |
          python controlla_integrita_catalogo.py
          python -m json.tool data/catalogo.json > /dev/null
          python -m json.tool data/catalogo_pubblicato.json > /dev/null
          python verifica_snapshot.py --previous /tmp/cheffino_snap_pre_recupero.json
          python diagnostica_foto_api.py
      - name: Registra solo modifiche validate
        run: |
          if git diff --quiet -- data/catalogo.json data/catalogo_pubblicato.json; then
            echo "Nessun recupero fotografico aggiuntivo."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalogo.json data/catalogo_pubblicato.json
          git commit -m 'Catalogo: due gallerie originali e assenza fonte certificata'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
