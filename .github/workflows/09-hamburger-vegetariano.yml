name: "Cheffino 09 - Recupera hamburger vegetariano"
on:
  push:
    paths:
      - '.github/workflows/09-hamburger-vegetariano.yml'
      - 'data/revisioni_foto_pubblicazione.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cheffino-catalogo-scrittura
  cancel-in-progress: false
jobs:
  recupero:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test e backup
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q
          cp data/catalogo_pubblicato.json /tmp/snapshot_pre_recupero.json
      - name: Associa foto fonte e ricalcola pubblicabilità
        run: |
          python recupera_hamburger_vegetariano.py --apply
          python controlla_integrita_catalogo.py
          python pubblica_catalogo.py
          python verifica_snapshot.py --previous /tmp/snapshot_pre_recupero.json --approved-photo-review data/revisioni_foto_pubblicazione.json
          python diagnostica_foto_api.py
          python -m json.tool data/catalogo.json > /dev/null
          python -m json.tool data/catalogo_pubblicato.json > /dev/null
      - name: Registra solo cataloghi verificati
        run: |
          if git diff --quiet -- data/catalogo.json data/catalogo_pubblicato.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalogo.json data/catalogo_pubblicato.json
          git commit -m 'Catalogo: recupera foto autentiche hamburger vegetariano'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
