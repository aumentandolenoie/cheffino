name: "Cheffino 10 - Completa foto blog pomodoro"
on:
  push:
    paths:
      - '.github/workflows/10-foto-blog-pomodoro.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cheffino-catalogo-scrittura
  cancel-in-progress: false
jobs:
  recupera:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test e backup
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q
          cp data/catalogo_pubblicato.json /tmp/snapshot_pre_blog.json
      - name: Recupera immagini reali blog e verifica pubblicazione
        run: |
          python recupera_foto_blog_pomodoro.py --apply
          # Soltanto DOPO che le tre foto sono verificate rimuovi la sospensione.
          python -c 'import json,pathlib; p=pathlib.Path("data/revisioni_foto_pubblicazione.json"); a=json.loads(p.read_text()); a=[x for x in a if x.get("id")!=5]; p.write_text(json.dumps(a,ensure_ascii=False,indent=2)+"\\n")'
          python controlla_integrita_catalogo.py
          python pubblica_catalogo.py
          python verifica_snapshot.py --previous /tmp/snapshot_pre_blog.json --approved-photo-review data/revisioni_foto_pubblicazione.json
          python diagnostica_foto_api.py
          python -m json.tool data/catalogo.json > /dev/null
          python -m json.tool data/catalogo_pubblicato.json > /dev/null
      - name: Salva modifiche al catalogo
        run: |
          if git diff --quiet -- data/catalogo.json data/catalogo_pubblicato.json data/revisioni_foto_pubblicazione.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalogo.json data/catalogo_pubblicato.json data/revisioni_foto_pubblicazione.json
          git commit -m 'Catalogo: ripristina galleria originale blog pasta al pomodoro'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
