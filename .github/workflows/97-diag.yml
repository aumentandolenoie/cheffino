name: "Diag eurospin (temporaneo)"
on:
  push:
    branches: ['diag-eurospin']
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import re
          from app.rete import fetch_text
          h=fetch_text('https://www.eurospin.com/it-it/volantino/',user_agent='Mozilla/5.0 (compatible; PepitoPersonalProject/0.2; volantini dai siti ufficiali)',same_host=False)
          for m in list(re.finditer(r'Dal \d+ al \d+ \w+ 20\d\d',h))[:3]:
              seg=h[m.start()-2500:m.end()+800]
              print('=====',m.group(0)); print(sorted(set(re.findall(r'href="([^"]+)"',seg))))
          print(sorted(set(re.findall(r'https://flyer\.eurospin\.com/it-it/[^"\'\s<>]+',h)))[:30])
          PY
