
name: Aggiorna catalogo settimanalmente

on:
  schedule:
    - cron: '15 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cheffino-import-catalogo
  cancel-in-progress: false

jobs:
  scopri-e-importa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scopri nuove ricette da sitemap ufficiali
        run: |
          python aggiorna_catalogo.py --limit 20 --delay 2.5
          python -m json.tool data/catalogo.json > /dev/null

      - name: Salva ricette importate in GitHub
        run: |
          if git diff --quiet -- data/catalogo.json; then
            echo 'Nessuna nuova scheda importata.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalogo.json
          git commit -m 'Catalogo: importa nuove ricette GialloZafferano (in revisione)'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
