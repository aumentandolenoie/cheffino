name: Aggiorna catalogo settimanalmente
on:
  schedule:
    - cron: '15 7 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cheffino-import-catalogo
  cancel-in-progress: false
jobs:
  scopri-e-importa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scopri e valida ricette
        run: |
          python aggiorna_catalogo.py --limit 20 --delay 2.5
          python classifica_catalogo.py
          python ripara_catalogo.py --limit 20 --delay 2.5
          python recupera_quantita_esplicite.py
          python recupera_ingredienti_fonte.py
          python recupera_quantita_mirate.py
          python classifica_catalogo.py
          python diagnostica_quantita.py --limit 20
          python verifica_catalogo.py
          python valida_catalogo.py
          python pulisci_procedimenti.py
          python controlla_integrita_catalogo.py --apply
          python importa_foto_passaggi.py --limit 25 --delay 2.5
          python -m json.tool data/catalogo.json > /dev/null
      - name: Salva catalogo
        run: |
          if git diff --quiet -- data/catalogo.json; then
            echo 'Nessuna modifica al catalogo.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalogo.json
          git commit -m 'Catalogo: importazione e validazione automatica'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
