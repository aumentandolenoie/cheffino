name: Cheffino - Test qualita
on:
  push:
    paths:
      - 'data/catalogo_pubblicato.json'
      - '.github/workflows/test-qualita.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -m compileall -q app *.py tests
      - name: Foto effettive pubblicate dalla API
        run: python diagnostica_foto_api.py
      - name: Audit catalogo reale (sola lettura)
        run: |
          python -m json.tool data/catalogo.json > /dev/null
          python audit_immagini.py --limit 5 > /tmp/audit-foto.txt
          tail -n 1 /tmp/audit-foto.txt
          python pubblica_catalogo.py --target /tmp/cheffino-snapshot-candidato.json
          python verifica_snapshot.py --snapshot /tmp/cheffino-snapshot-candidato.json

  prova-rete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Raccolta limitata da sito reale (solo runner)
        run: |
          python aggiorna_catalogo.py --limit 2 --delay 2.5
          python -m json.tool data/catalogo.json > /dev/null
      - name: Arricchimento e immagini limitati (solo runner)
        run: |
          python classifica_catalogo.py
          python ripara_catalogo.py --limit 2 --delay 2.5
          python recupera_quantita_esplicite.py
          python recupera_ingredienti_fonte.py
          python recupera_quantita_mirate.py
          python pulisci_procedimenti.py
          python controlla_integrita_catalogo.py --apply
          python importa_foto_passaggi.py --limit 2 --delay 2.5
          python controlla_integrita_catalogo.py --apply
          python audit_immagini.py --online --limit 3 | tail -n 6
      - name: Validazione, snapshot e confronto sul runner
        run: |
          python classifica_catalogo.py
          python valida_catalogo.py
          python pubblica_catalogo.py --target /tmp/catalogo_pubblicato_test.json
          python verifica_snapshot.py --snapshot /tmp/catalogo_pubblicato_test.json
          python -m json.tool /tmp/catalogo_pubblicato_test.json > /dev/null
      - name: Conferma foto storica dal sito originale (sola lettura)
        run: python ripara_foto_storica.py --dry-run
      - name: Simula ripristino dei procedimenti originali pubblicati (sola lettura)
        run: python ripristina_passaggi_storici.py
      - name: Evidenze originali delle sette ricette (sola lettura)
        run: python diagnostica_ultime_sette.py
      - name: Simula recupero sicuro di due ricette senza modifiche
        run: python recupera_due_ricette_residue.py
      - name: Simula certificazione di assenza nella fonte originale
        run: python certifica_assenza_foto_fonte.py
      - name: Verifica nessuna pubblicazione
        run: |
          git diff --exit-code -- data/catalogo_pubblicato.json
          test -z "$(git status --porcelain -- data/catalogo_pubblicato.json)"
          echo 'Snapshot persistente non modificato; nessun commit/push.'
