name: Cheffino - Test qualita
on:
  push:
    paths:
      - '**.py'
      - 'frontend/**'
      - 'index.html'
      - 'data/catalogo_pubblicato.json'
      - '.github/workflows/test-qualita.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -m compileall -q app *.py tests
      - name: Foto effettive pubblicate dalla API
        run: python diagnostica_foto_api.py
      - name: Audit catalogo reale (sola lettura)
        run: |
          python -m json.tool data/catalogo.json > /dev/null
          python audit_immagini.py --limit 5 > /tmp/audit-foto.txt
          tail -n 1 /tmp/audit-foto.txt
          python pubblica_catalogo.py --target /tmp/cheffino-snapshot-candidato.json
          python verifica_snapshot.py --snapshot /tmp/cheffino-snapshot-candidato.json --approved-photo-review data/revisioni_foto_pubblicazione.json

  confronto-fonti:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confronta estrattore con fonti reali senza scrivere cataloghi
        run: python importa_foto_passaggi.py --published-only --limit 35 --delay 2.5 --dry-run --recipe-id 5 --recipe-id 211658408928202 --recipe-id 74528043300452 --recipe-id 182532426058049 --recipe-id 149444968096049 --report /tmp/confronto-media.json
      - name: Verifica cataloghi immutati
        run: git diff --exit-code -- data/catalogo.json data/catalogo_pubblicato.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: confronto-media
          path: /tmp/confronto-media.json
          retention-days: 30
