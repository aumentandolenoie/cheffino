<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Pepito</title>
  <defs>
    <linearGradient id="wood" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7a4a26"/>
      <stop offset=".45" stop-color="#b9763e"/>
      <stop offset="1" stop-color="#6b3f20"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8d969c"/>
      <stop offset=".5" stop-color="#e6eaec"/>
      <stop offset="1" stop-color="#7c858b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#d9edc9"/>
  <!-- grani di pepe -->
  <g fill="#2b2b2b">
    <circle cx="120" cy="420" r="13"/><circle cx="154" cy="438" r="10"/><circle cx="392" cy="424" r="12"/>
    <circle cx="362" cy="442" r="9"/><circle cx="410" cy="392" r="8"/>
  </g>
  <!-- pomello -->
  <circle cx="256" cy="74" r="26" fill="url(#metal)"/>
  <rect x="246" y="92" width="20" height="22" rx="4" fill="#9aa3a8"/>
  <!-- testa del macinino -->
  <path d="M176 150 C176 112 336 112 336 150 L336 168 L176 168 Z" fill="url(#wood)"/>
  <rect x="166" y="164" width="180" height="20" rx="10" fill="#5b331a"/>
  <!-- corpo a clessidra -->
  <path d="M184 188 L328 188 C328 236 292 262 292 300 C292 338 336 356 336 398 L176 398 C176 356 220 338 220 300 C220 262 184 236 184 188 Z" fill="url(#wood)"/>
  <!-- riflesso -->
  <path d="M206 198 C206 238 236 262 236 300 C236 330 208 350 200 380" fill="none" stroke="#e7b07a" stroke-width="10" stroke-linecap="round" opacity=".55"/>
  <!-- base metallica -->
  <rect x="168" y="394" width="176" height="30" rx="12" fill="url(#metal)"/>
  <rect x="190" y="424" width="132" height="12" rx="6" fill="#7c858b"/>
</svg>
