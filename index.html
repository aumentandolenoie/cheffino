ter}.smallbtn{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:6px 9px;color:var(--text);font-size:12px;font-weight:700}.overlay{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}
.overlay,.modal,.photoviewer{overscroll-behavior:contain}.modal{-webkit-overflow-scrolling:touch}.overlay{touch-action:pan-y}.modal{width:min(650px,100%);max-height:85vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.close{border:0;background:var(--surface2);border-radius:10px;padding:7px 11px;color:var(--text)}.cartday{border:1px solid var(--line);border-radius:13px;margin:8px 0;background:var(--surface);color:var(--text);padding:13px;width:100%;display:flex;justify-content:space-between}.ingredientrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.ingredientrow input{accent-color:var(--green)}.notice{background:var(--surface2);padding:12px 14px;border-radius:12px;color:var(--muted);font-size:12px;margin-top:15px}.empty{text-align:center;padding:45px 15px;color:var(--muted)}.hidden{display:none!important}

/* Dettaglio ricetta: aggiunta isolata, senza modificare lo stile originale */
.detailhero{min-height:245px;border-radius:19px;background:linear-gradient(135deg,#f7e8d4,#c8d8ad);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;margin-top:17px}.detailhero .foodart{font-size:100px}.detailhero small{font-size:12px;color:#53604c}.detailmetrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:15px 0}.detailmetric{background:var(--surface2);border:1px solid var(--line);border-radius:13px;text-align:center;padding:14px 4px;min-width:0}.detailmetric b{display:block;font-size:17px;margin-top:6px;overflow-wrap:anywhere}.detailmetric span{font-size:11px;color:var(--muted)}.detailmacros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:20px}.detailmacro{text-align:center;border-radius:13px;padding:12px 4px;color:#252a1e}.detailmacro b{display:block;font-size:17px}.detailmacro span{font-size:11px}.detailmacro.protein{background:#bce6b8}.detailmacro.carbs{background:#f8dda0}.detailmacro.fats{background:#f3b79a}.detailsteps{padding-left:23px}.detailsteps li{padding:0 0 13px 5px;line-height:1.6}.sourcebtn{display:inline-block;color:var(--green);font-weight:750;margin-top:12px}.detailrow{justify-content:space-between}.detailrow strong{white-space:nowrap;text-align:right}.recipecard .thumb,.recipecard h3{cursor:pointer}@media(max-width:450px){.detailmetrics{gap:5px}.detailmetric{padding:10px 2px}.detailmetric b{font-size:13px}.detailmetric span{font-size:10px}.detailhero{min-height:185px}}

.saved-section{margin-top:36px}.saved-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:17px}.saved-all{border:0;background:transparent;color:var(--green);font-weight:800;padding:8px;white-space:nowrap}.saved-all:hover{text-decoration:underline}.saved-modal-grid{grid-template-columns:1fr}.saved-section .hint{padding:15px 0}
/* Centra l'ultima scheda nei layout a due colonne quando il totale e dispari. */
.weekly-recipes-grid > .recipecard:last-child:nth-child(odd){grid-column:1 / -1;width:calc((100% - 13px)/2);justify-self:center}
@media(max-width:760px){.weekly-recipes-grid > .recipecard:last-child:nth-child(odd){grid-column:auto;width:100%}}
.source-switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 15px;margin-top:17px;border:1px solid var(--line);background:var(--surface);border-radius:14px}.source-switch small{display:block;color:var(--muted);font-size:11px;margin-top:3px}@media(max-width:550px){.source-switch{flex-direction:column;align-items:stretch}.source-switch button{width:100%}}.detailhero img,.recipephoto{width:100%;height:100%;object-fit:cover;border-radius:inherit;position:absolute;inset:0;z-index:2}.detailhero{position:relative;overflow:hidden}.thumb{overflow:hidden;position:relative}.thumbphoto{width:100%;height:100%;object-fit:cover}
/* Pepito mobile polish: conserva card e gerarchia visiva del desktop. */
@media (max-width:760px){
  html,body,.app{max-width:100%;overflow-x:clip}
  .wrap{padding:22px 14px 48px}
  .topbar{padding:0 14px;gap:8px}
  .brand{font-size:20px;white-space:nowrap}
  .topright{min-width:0}
  .topright .btn{padding:9px 11px;font-size:12px;white-space:nowrap}
  .panel{padding:18px 15px}
  .stephead{align-items:flex-start;gap:8px}
  .stepcount{white-space:nowrap;font-size:11px}
  .h1{font-size:clamp(25px,7vw,32px);line-height:1.12;letter-spacing:-1px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .choice{padding:13px;min-width:0;overflow-wrap:anywhere}
  .footer{flex-wrap:wrap;gap:10px}
  .footer>.hint{order:3;flex-basis:100%;text-align:center}
  .days{grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
  .daycheck{min-width:0;padding:10px 0}
  .summarybar{grid-template-columns:repeat(2,minmax(0,1fr));gap:0;padding:7px 10px}
  .summaryitem{min-width:0;padding:12px 9px;border-right:0;border-bottom:1px solid var(--line)}
  .summaryitem:nth-child(odd){border-right:1px solid var(--line)}
  .summaryitem:nth-last-child(1){border-bottom:0}
  .summaryvalue{overflow-wrap:anywhere;font-size:13px}
  .summarylabel{font-size:11px}
  .actiongrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:27px}
  .actioncard{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:13px}
  .actioncard strong{font-size:14px;line-height:1.25}
  .actioncard span{font-size:11px}
  .actioncard>span:last-child{display:none}
  .recipegrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .recipecard{display:flex;flex-direction:column;align-items:stretch;gap:9px;min-width:0;padding:9px;border-radius:16px}
  .recipecard>.thumb{width:100%;height:auto;aspect-ratio:1.55;flex-shrink:0;font-size:38px}
  .recipecard>div:nth-child(2){min-width:0;display:flex;flex-direction:column;flex:1}
  .recipecard h3{font-size:13px;line-height:1.28;overflow-wrap:anywhere;margin:7px 0}
  .recipecard .cardmeta{font-size:11px;line-height:1.35;overflow-wrap:anywhere;margin:0 0 8px}
  .recipecard .cardtop{align-items:center}
  .recipecard .iconbtn{min-width:27px;min-height:30px}
  .recipecard .cardactions{margin-top:auto;justify-content:space-between;gap:5px}
  .recipecard .smallbtn{font-size:11px;padding:7px 8px;white-space:normal;text-align:center}
  .weekly-recipes-grid>.recipecard:last-child:nth-child(odd){grid-column:1/-1;width:calc((100% - 10px)/2);justify-self:center}
  .saved-heading{align-items:center}
  .saved-heading h2{font-size:21px!important}
  .saved-all{font-size:12px;padding:6px 0}
  .modal{padding:18px 15px;max-height:calc(100dvh - 32px);border-radius:18px}
  .modalhead{align-items:flex-start}
  .modalhead h2{font-size:20px;overflow-wrap:anywhere}
  .detailmetrics{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
  .detailmetric{padding:12px 3px}
  .detailmetric b{font-size:12px;line-height:1.2}
  .detailmetric span{font-size:10px}
  .detailmacros{gap:6px}
  .detailmacro{padding:12px 3px}
  .detailmacro b{font-size:14px}
  .source-switch{gap:10px}
}
@media(max-width:400px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .recipegrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .recipecard{grid-template-columns:unset}
  .recipecard>.thumb{height:auto}
  .weekly-recipes-grid>.recipecard:last-child:nth-child(odd){grid-column:1/-1;width:calc((100% - 10px)/2)}
  .pill{display:none}
  .actioncard{padding:11px}
  .detailmetrics{gap:4px}
}
@media(max-width:350px){
  .recipegrid{gap:7px}
  .recipecard{padding:7px}
  .recipecard h3{font-size:12px}
  .recipecard .smallbtn{padding:6px 5px}
  .summarybar{padding:5px}
}

/* Pepito — griglie dispari: ultima scheda a larghezza intera */
.weekly-recipes-grid > .recipecard:last-child:nth-child(odd) {
  grid-column: 1 / -1;
  width: 100%;
  justify-self: stretch;
}
@media (max-width: 760px) {
  /* Quinto riquadro centrato, largo quanto gli altri; nessuna cella vuota. */
  .summarybar > .summaryitem:last-child:nth-child(odd) {
    grid-column: 1 / -1;
    width: calc((100% - 0px) / 2);
    justify-self: center;
    border-right: 0;
    border-bottom: 0;
    text-align: center;
  }
  .weekly-recipes-grid > .recipecard:last-child:nth-child(odd) {
    grid-column: 1 / -1;
    width: 100%;
    justify-self: stretch;
  }
}
/* Gallerie fotografiche dei passaggi, solo se abbinate con certezza */
.catalog-results{display:grid;gap:9px;max-height:49vh;overflow:auto;margin-top:10px}.catalog-result{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:13px;padding:9px}.catalog-result:hover{border-color:var(--green)}.catalog-photo{display:grid;place-items:center;flex:none;width:70px;height:62px;background:var(--surface2);border-radius:9px;overflow:hidden;font-size:27px}.catalog-photo img{width:100%;height:100%;object-fit:cover}.catalog-copy{flex:1;min-width:0}.catalog-copy strong{display:block;overflow-wrap:anywhere;font-size:14px}.catalog-copy small{display:block;color:var(--muted);font-size:12px;margin-top:5px}@media(max-width:510px){.topright .search-trigger span,.topright .settings-trigger span{display:none}.topright .btn{padding:9px 12px}}.detailsteps li{margin-bottom:18px}
.step-photos{overscroll-behavior-x:contain;touch-action:pan-x pan-y;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px 0 16px;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.step-shot{position:relative;flex:0 0 min(86%,420px);scroll-snap-align:start;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2) no-repeat;aspect-ratio:4/3;cursor:zoom-in}
.step-shot img{display:block;width:100%;height:100%;object-fit:cover}
.step-shot .shot-n,.pv-caption{position:absolute;background:rgba(0,0,0,.6);color:#fff;font-size:12px;border-radius:999px;padding:3px 9px}
.step-shot .shot-n{left:8px;bottom:8px}
.photoviewer{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center}
.photoviewer.open{display:flex}
.pv-img{display:block;max-width:96vw;max-height:84vh;object-fit:contain;border-radius:8px}
.pv-stage{max-width:96vw;max-height:84vh;overflow:hidden;border-radius:8px;cursor:zoom-in}
.pv-stage.zoomed{width:96vw;height:84vh;overflow:auto;cursor:zoom-out;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.pv-stage.zoomed .pv-img{max-width:none;max-height:none;width:220%;border-radius:0}
.pv-stage.zoomed .pv-strip{width:180%;border-radius:0}
.pv-strip{width:min(96vw,calc(84vh * 220 / 170));border-radius:8px;background-repeat:no-repeat}
.pv-close,.pv-nav{position:absolute;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;cursor:pointer}
.pv-close{top:14px;right:14px;width:42px;height:42px;font-size:20px}

<body><div class="app" id="app"><header class="topbar"><div class="brand"><div class="logo"><img src="/icons/pepito.svg" alt="" width="37" height="37"></div>Pepito</div><div class="topright"><button class="btn search-trigger" onclick="openRecipeSearch()" aria-label="Cerca ricette">⌕ <span>Cerca ricette</span></button><button class="btn settings-trigger" onclick="openSettings()" aria-label="Preferenze">⚙ <span>Preferenze</span></button></div></header><main class="wrap" id="main"></main></div><div id="modalRoot"></div><input id="cheffinoBackupInput" type="file" accept="application/json,.json" style="display:none" onchange="importCheffinoBackup(this)">
<script>
const supermarkets=['Aldi','Alì','Bennet','Carrefour','Conad','Coop','Decò','Despar','Dodecà','Esselunga','Eurospin','Famila','Il Gigante','Lidl','MD','PAM','Penny','Sole365','Tigros'];
const ingredients=['Aglio','Albicocche','Anacardi','Arance','Asparagi','Avena','Avocado','Basilico','Bietole','Broccoli','Burro','Cacao','Carciofi','Carne bovina','Carne di maiale','Carote','Cavolfiore','Ceci','Ciliegie','Cipolla','Cipollotto','Cocco','Cozze','Cous cous','Crescenza','Curry','Farina','Farina di mais','Fagioli','Fagiolini','Farro','Feta','Finocchi','Formaggio','Funghi','Gamberi','Gnocchi','Grana','Insalata','Kefir','Lattuga','Latte','Lenticchie','Limone','Mais','Mandorle','Manzo','Melanzane','Mele','Merluzzo','Miele','Mirtilli','Mozzarella','Noci','Olio d’oliva','Olive','Orzo','Pancetta','Pane','Panna','Parmigiano','Patate','Peperoncino','Peperoni','Pere','Pesce spada','Piselli','Pistacchi','Pollo','Pomodori','Porri','Prosciutto cotto','Prosciutto crudo','Quinoa','Radicchio','Riso','Ricotta','Rucola','Salmone','Salsiccia','Sedano','Seitan','Semi di chia','Spinaci','Stracchino','Tacchino','Tofu','Tonno','Uova','Uva','Yogurt','Zafferano','Zenzero','Zucchine','Zucca','Zuppa pronta','Pasta','Pasta integrale','Piadine','Pesto','Pane grattugiato','Pangrattato','Passata di pomodoro','Pecorino','Panna vegetale','Latte di soia','Latte di avena','Tempeh','Edamame','Quorn','Sgombro','Orata','Branzino','Calamari','Seppie','Vongole','Ricotta senza lattosio','Yogurt senza lattosio','Pane senza glutine','Pasta senza glutine','Cioccolato fondente','Datteri','Fichi','Fragole','Lamponi','Melone','Ananas','Banane','Pompelmo','Cachi','Cavolo cappuccio','Cavolo nero','Cavolini di Bruxelles','Rape','Ravanelli','Barbabietole','Patate dolci','Cime di rapa','Fave','Lupini','Soia','Farina di ceci','Polenta','Bulgur','Noodles','Salsa di soia','Aceto balsamico','Senape','Maionese','Ketchup','Olive nere','Capperi','Acciughe','Ricotta salata','Scamorza','Provola','Fontina','Gorgonzola','Taleggio','Pecorino romano','Bresaola','Speck','Mortadella','Wurstel','Fesa di tacchino','Cosce di pollo','Petto di pollo','Lombo di maiale','Vitello','Agnello','Seitan','Burger vegetali'];
// Catalogo esclusivamente da fonti: niente ricette demo o fallback incorporati.
const recipeData=[];
const sourcedDetails={};
const catalogBrowse=[];
let recipeSearchQuery='';
let recipeSearchFilter='all';
let catalogLoading=true;
let catalogError='';
let catalogTotal=0;
function peopleCount(){return Math.max(1,parseInt(state.people,10)||1)}
function recipeDetailData(r){return sourcedDetails[r.id]||null}
function ingredientRows(r,checkboxes=false){const d=recipeDetailData(r);if(!d)return '<p class="hint">Grammature non verificate: non è corretto inventarle per questa ricetta.</p>'+r.ings.map(x=>`<div class="ingredientrow">${checkboxes?'<input type="checkbox">':'•'} <span>${safe(x)}</span><strong style="margin-left:auto">Da verificare</strong></div>`).join('');const factor=Number(d.servings)>0?peopleCount()/Number(d.servings):null;return d.ingredients.map(([name,q,u])=>{const qty=q===null?(u==='q.b.'?'q.b.':'Da verificare'):(typeof q==='number'&&Number.isFinite(q)&&factor!==null?(q*factor).toLocaleString('it-IT',{maximumFractionDigits:2})+' '+(u||''):'Da verificare');return `<label class="ingredientrow detailrow">${checkboxes?'<input type="checkbox">':'<span>•</span>'}<span style="flex:1">${safe(name)}</span><strong>${safe(qty)}</strong></label>`}).join('')}
const days=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];const dayShort=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const defaults={step:0,stores:[],budget:'60',people:'2',meals:'both',diet:['Nessuna'],kitchen:['Fornelli','Forno'],styles:['Veloci e facili','Classici italiani'],avoid:[],lunch:[],dinner:[],types:[],likes:[],dislikes:[],swipeIndex:0,plan:{},favorites:[],planGeneration:0,view:'onboard',tab:'Pranzo'};
let ingredientPanelOpen=false;
let state={...defaults};try{const saved=JSON.parse(localStorage.getItem('cheffinoState')||'null');if(saved){state={...defaults,...saved};if(typeof state.diet==='string')state.diet=[state.diet];if(Array.isArray(state.stores))state.stores=[...new Set(state.stores.map(x=>x==='Dec'?'Decò':x))];if(saved.schemaVersion!==2){state.lunch=[];state.dinner=[];state.types=[];state.schemaVersion=2;}}else state.schemaVersion=2;}catch(e){}
const persist=()=>{try{localStorage.setItem('cheffinoState',JSON.stringify(state))}catch(e){}};
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function countMeals(){return (state.meals==='lunch'?state.lunch.length:state.meals==='dinner'?state.dinner.length:state.lunch.length+state.dinner.length)}
function chosenDays(){let a=[];if(state.meals!=='dinner')state.lunch.forEach(i=>{if(!a.includes(i))a.push(i)});if(state.meals!=='lunch')state.dinner.forEach(i=>{if(!a.includes(i))a.push(i)});return a.sort((a,b)=>a-b)}
function filteredRecipes(options={}){
 const diets=Array.isArray(state.diet)?state.diet:[state.diet];
 return recipeData.filter(r=>{
  // Le schede approvate automaticamente non certificano allergeni o diete.
  // In presenza di esigenze alimentari specifiche non mostrarle come sicure.
  if(r.autoValidated){
   // «Nessuna cottura» (crudi, insalate): nessuna attrezzatura richiesta.
   if(!r.requiredTools.length || r.requiredTools.some(t=>t!=='Nessuna cottura'&&!state.kitchen.includes(t)))return false;
  }
  // Esigenze alimentari: compatibilità calcolata dal server sugli ingredienti della fonte
  // (app/diete.py). Entrano solo le ricette con esito «si»; le dubbie restano escluse.
  const dietInfo=recipeDetailData(r)?.diets||{};
  if(diets.some(d=>d!=='Nessuna'&&dietInfo[d]!=='si'))return false;

  if(r.ings.some(i=>state.avoid.includes(i)))return false;
   const sourceIngs=recipeDetailData(r)?.ingredients.map(i=>i[0].toLowerCase())||[];
   const fold=(x)=>String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
   if(state.avoid.some(a=>sourceIngs.some(i=>{
     const ing=fold(i), excluded=fold(a);
     return ing===excluded || ing.startsWith(excluded+' ') || ing.endsWith(' '+excluded) || ing.includes(' '+excluded+' ');
   })))return false;

  if(!options.relaxStyles&&state.styles.length&&!styleHits(r))return false;
  if(state.types.length){const allowed=[];if(state.types.includes('Primo'))allowed.push('Primo');if(state.types.includes('Secondo'))allowed.push('Secondo');if(state.types.includes('Piatto Unico'))allowed.push('Piatto unico');if(state.types.includes('Primo e Secondo'))allowed.push('Primo','Secondo');if(!allowed.includes(r.type))return false;}
  if((r.name.toLowerCase().includes('forno')||r.name.toLowerCase().includes('al forno'))&&!state.kitchen.includes('Forno'))return false;
  if(!state.kitchen.length&&!(r.requiredTools?.length&&r.requiredTools.every(t=>t==='Nessuna cottura')))return false;
  return true;
 });
}
// Gli stili sono preferenze per il piano, non un catalogo chiuso.
// Se ci sono abbastanza ricette con gli stili scelti (almeno il doppio dei pasti),
// il piano usa solo quelle; altrimenti si allarga al resto del catalogo compatibile.
function planRecipes(){const all=filteredRecipes({relaxStyles:true}).filter(r=>!!recipeDetailData(r));if(!state.styles.length)return all;const strict=all.filter(r=>styleHits(r)>0);return strict.length>=Math.max(14,requestedSlots().length*2)?strict:all}
// Ordine casuale riproducibile: lo stesso seme dà lo stesso ordine, così i render
// ripetuti non rimescolano le carte; un seme nuovo a ogni onboarding e a ogni «rigenera».
function newSeed(){try{return crypto.getRandomValues(new Uint32Array(1))[0]}catch(e){return Math.floor(Math.random()*4294967296)}}
function seededRandom(seed,id){let h=(Number(seed)^0x9e3779b9)>>>0;const t=String(id);for(let i=0;i<t.length;i++)h=Math.imul(h^t.charCodeAt(i),2654435761)>>>0;h^=h>>>16;h=Math.imul(h,2246822507)>>>0;h^=h>>>13;h=Math.imul(h,3266489909)>>>0;h^=h>>>16;return ((h>>>0)+0.5)/4294967297}
// Proposte iniziali: ricette casuali dall'intero catalogo compatibile con le scelte,
// alternando i tipi di piatto (primo, secondo, piatto unico) per conoscere meglio i gusti.
// Quanti stili scelti nell'onboarding ha la ricetta.
function styleHits(r){return (r.stili||[]).filter(s=>state.styles.includes(s)).length}
function tinderRecipes(){
 if(state.swipeSeed==null)state.swipeSeed=newSeed();
 const seed=state.swipeSeed;
 // Prima le ricette con almeno uno degli stili scelti, in ordine casuale; poi le altre.
 const pool=filteredRecipes({relaxStyles:true}).filter(r=>!!recipeDetailData(r)).sort((a,b)=>(styleHits(b)>0)-(styleHits(a)>0)||seededRandom(seed,a.id)-seededRandom(seed,b.id));
 const byType=new Map();pool.forEach(r=>{if(!byType.has(r.type))byType.set(r.type,[]);byType.get(r.type).push(r)});
 const queues=[...byType.values()].sort((a,b)=>seededRandom(seed,a[0].type)-seededRandom(seed,b[0].type));
 const out=[];while(out.length<pool.length)for(const q of queues)if(q.length)out.push(q.shift());
 return out;
}
function getRecipe(id){return recipeData.find(r=>r.id===id)||catalogBrowse.find(r=>r.id===id)||null}
function planHasDuplicates(){const ids=Object.values(state.plan||{});return new Set(ids).size!==ids.length}
function render(){if(catalogLoading){document.getElementById('main').innerHTML='<section class="panel"><h2>Caricamento catalogo ricette…</h2><p>Sto leggendo le ricette con fonte dal server.</p></section>';return;}if(state.view==='home'&&(planHasDuplicates()||requestedSlots().some(k=>state.plan[k]===undefined&&state.planMissing===undefined))){generateWeeklyPlan()}persist();const main=document.getElementById('main');if(state.view==='home'){renderHome(main);return}if(state.view==='swipe'){renderSwipe(main);return}renderOnboard(main)}
const stepTitles=['Dove fai la spesa?','Quanto vuoi spendere?','Per quante persone cucini?','Quali pasti vuoi organizzare?','Le tue esigenze alimentari','La tua cucina','Che tipo di ricette preferisci?','Quando mangi a casa?','Come vuoi comporre i pasti?'];
function renderOnboard(main){const s=state.step;let body='';if(s===0)body=`<p class="sub">Scegli i supermercati che frequenti. Premendo «Volantino» aprirai sempre l'ultimo volantino ufficiale dei supermercati scelti.</p><div class="grid">${supermarkets.map(n=>choice(n,'🏪',state.stores.includes(n),`toggleArray('stores','${n}')`)).join('')}</div><p class="hint" style="margin-top:15px">Selezionane uno o più. Puoi modificarli anche in seguito.</p>`;
if(s===1)body=`<p class="sub">Imposta un budget indicativo per la spesa della settimana, per tutte le persone selezionate.</p><div class="numwrap"><div class="amount">€ ${safe(state.budget||'0')}</div><div class="numpad">${['1','2','3','4','5','6','7','8','9','⌫','0','C'].map(n=>`<button class="numkey" onclick="numKey('${n}')">${n}</button>`).join('')}</div><span class="hint">Budget settimanale in euro</span></div>`;
if(s===2)body=`<p class="sub">Le quantità degli ingredienti verranno adattate al numero di persone.</p><div class="grid">${['1','2','3','4','5','6+'].map((n,i)=>choice(n+' '+(n==='1'?'persona':'persone'),['🧍','👥','👥','👨‍👩‍👧','👨‍👩‍👧‍👦','👪'][i],state.people===n,`setVal('people','${n}')`)).join('')}</div>`;
if(s===3)body=`<p class="sub">Scegli i momenti della giornata per cui vuoi organizzare le ricette.</p><div class="grid">${[['lunch','☀️','Solo pranzo','Un pasto al giorno'],['dinner','🌙','Solo cena','Un pasto al giorno'],['both','🍽️','Pranzo e cena','Fino a due pasti al giorno']].map(([v,e,t,d])=>choice(t,e,state.meals===v,`setVal('meals','${v}')`,d)).join('')}</div>`;
if(s===4)body=`<p class="sub">Puoi selezionare più esigenze contemporaneamente. Per allergie o condizioni mediche, controlla sempre etichette e contaminazioni.</p><div class="grid">${[['Nessuna','🍽️'],['Vegetariano','🥦'],['Vegano','🌱'],['Senza Glutine','🌾'],['Senza Lattosio','🥛']].map(([v,e])=>choice(v,e,state.diet.includes(v),`toggleDiet('${v}')`)).join('')}</div>`;
if(s===5)body=`<p class="sub">Attiva gli strumenti che hai in cucina: eviteremo di proporti ricette che ne richiedono uno non disponibile.</p><div class="togglelist">${[['Fornelli','🔥'],['Forno','♨️'],['Microonde','📡'],['Friggitrice ad aria','🍟']].map(([n,e])=>`<button class="toggleitem" onclick="toggleArray('kitchen','${n}')"><span>${e} &nbsp; ${n}</span><span class="switch ${state.kitchen.includes(n)?'on':''}"></span></button>`).join('')}</div>`;
if(s===6)body=`<p class="sub">Seleziona fino a quattro stili. Puoi anche indicare gli ingredienti che non vuoi trovare nei piatti.</p><div class="grid">${[['Veloci e facili','⚡','Pochi passaggi, poco tempo'],['Proteici','💪','Ricchi di proteine'],['Piatti salutari','🥗','Leggeri e bilanciati'],['Per tutta la famiglia','👨‍👩‍👧','Semplici e versatili'],['Classici italiani','🍝','Ricette di casa'],['Poche calorie','🌿','Leggeri ma sazianti'],['Economiche','🪙','Attenzione alla spesa'],['Takeaway fatto in casa','🍔','Stile fast food']].map(([n,e,d])=>choice(n,e,state.styles.includes(n),`toggleStyle('${n}')`,d)).join('')}</div><div class="hint" style="margin-top:10px">${state.styles.length}/4 stili selezionati</div><details id="avoidDetails" ${ingredientPanelOpen?'open':''} ontoggle="ingredientPanelOpen=this.open"><summary>＋ Ingredienti che non vuoi mangiare (${state.avoid.length})</summary><input class="search" id="ingredientSearch" placeholder="Cerca un ingrediente…" oninput="filterIngredients(this.value)"><div class="ingredient-list" id="ingredientList">${ingredientChips(ingredients)}</div><p class="hint">Se un ingrediente è escluso, le ricette che lo contengono verranno filtrate. Le sostituzioni sono previste solo quando sensate.</p></details>`;
if(s===7)body=`<p class="sub">Tocca i giorni in cui sei a casa. Nessun giorno è selezionato in partenza.</p><div class="sectionlabel">☀️ Pranzo <button class="smallbtn" onclick="toggleAllDays('lunch')">${state.lunch.length===7?'Deseleziona tutti':'Tutti i giorni'}</button></div><div class="days">${days.map((d,i)=>dayButton(i,'lunch')).join('')}</div><div class="sectionlabel">🌙 Cena <button class="smallbtn" onclick="toggleAllDays('dinner')">${state.dinner.length===7?'Deseleziona tutti':'Tutti i giorni'}</button></div><div class="days">${days.map((d,i)=>dayButton(i,'dinner')).join('')}</div><div class="notice">Il piano verrà creato soltanto per i giorni e i pasti selezionati.</div>`;
if(s===8)body=`<p class="sub">Scegli al massimo due tipologie per organizzare la composizione dei pasti.</p><div class="grid">${[['Primo','🍝'],['Secondo','🍗'],['Primo e Secondo','🍝🍗'],['Piatto Unico','🥘']].map(([n,e])=>choice(n,e,state.types.includes(n),`toggleType('${n}')`)).join('')}</div><div class="hint" style="margin-top:10px">${state.types.length}/2 scelte</div>`;
main.innerHTML=`<div class="eyebrow">Il tuo percorso · ${s+1} di 9</div><div class="stephead"><h1 class="h1">${stepTitles[s]}</h1><span class="stepcount">PASSO 0${s+1}</span></div><div class="progress"><span style="width:${(s+1)/9*100}%"></span></div><section class="panel">${body}<div class="footer"><button class="btn" onclick="prevStep()" ${s===0?'disabled':''}>← Indietro</button><div class="hint">Le tue scelte vengono salvate su questo dispositivo</div><button class="btn primary" onclick="nextStep()">${s===8?'Scopri le ricette →':'Continua →'}</button></div></section>`}
function choice(name,emoji,sel,fn,desc=''){return `<button class="choice ${sel?'selected':''}" onclick="${fn}"><span class="tick">${sel?'✓':''}</span><span class="emoji">${emoji}</span><strong>${name}</strong>${desc?`<span class="small">${desc}</span>`:''}</button>`}
function ingredientChips(arr){return arr.map(n=>`<button class="chip ${state.avoid.includes(n)?'selected':''}" data-ingredient="${safe(n)}" onclick="toggleAvoidIngredient('${n.replace(/'/g,"\\'")}')">${state.avoid.includes(n)?'✓ ':''}${safe(n)}</button>`).join('')}
function dayButton(i,key){const sel=state[key].includes(i);return `<button class="daycheck ${sel?'selected':''}" onclick="toggleDay('${key}',${i})"><b>${dayShort[i]}</b>${sel?'✓':'+'}</button>`}
function numKey(n){if(n==='C')state.budget='';else if(n==='⌫')state.budget=state.budget.slice(0,-1);else if(state.budget.length<4)state.budget=(state.budget==='0'?'':state.budget)+n;render()}
function setVal(k,v){state[k]=v;render()}function toggleArray(k,v){state[k]=state[k].includes(v)?state[k].filter(x=>x!==v):[...state[k],v];render()}
function toggleDiet(v){if(v==='Nessuna'){state.diet=['Nessuna']}else{state.diet=state.diet.filter(x=>x!=='Nessuna');state.diet=state.diet.includes(v)?state.diet.filter(x=>x!==v):[...state.diet,v];if(!state.diet.length)state.diet=['Nessuna']}render()}
function toggleAllDays(k){state[k]=state[k].length===7?[]:[0,1,2,3,4,5,6];render()}
function toggleStyle(v){if(state.styles.includes(v))state.styles=state.styles.filter(x=>x!==v);else if(state.styles.length<4)state.styles.push(v);render()}
function toggleType(v){if(state.types.includes(v))state.types=state.types.filter(x=>x!==v);else if(state.types.length<2)state.types.push(v);render()}
function toggleDay(k,i){state[k]=state[k].includes(i)?state[k].filter(x=>x!==i):[...state[k],i].sort((a,b)=>a-b);render()}
function toggleAvoidIngredient(name){
 state.avoid=state.avoid.includes(name)?state.avoid.filter(x=>x!==name):[...state.avoid,name];
 persist();
 const summary=document.querySelector('#avoidDetails summary');
 if(summary)summary.textContent=`＋ Ingredienti che non vuoi mangiare (${state.avoid.length})`;
 const query=document.getElementById('ingredientSearch')?.value||'';
 const list=document.getElementById('ingredientList');
 if(list)list.innerHTML=ingredientChips(ingredients.filter(x=>x.toLowerCase().includes(query.toLowerCase())));
}
function filterIngredients(q){const list=ingredients.filter(x=>x.toLowerCase().includes(q.toLowerCase()));document.getElementById('ingredientList').innerHTML=ingredientChips(list)}
function prevStep(){if(state.step>0)state.step--;render()}function nextStep(){if(state.step<8){state.step++;render()}else{state.view='swipe';state.swipeIndex=0;state.swipeSeed=newSeed();state.likes=[];state.dislikes=[];render()}}
function renderSwipe(main){let pool=tinderRecipes();if(!pool.length){main.innerHTML=`<div class="panel empty"><h2>Nessuna ricetta compatibile</h2><p>Con le preferenze attuali non troviamo ricette che rispettino tutti i criteri. Torna indietro e modifica stili, esigenze alimentari, ingredienti esclusi o attrezzatura.</p><button class="btn primary" onclick="state.view='onboard';state.step=6;render()">Modifica preferenze</button></div>`;return}const r=pool[state.swipeIndex%pool.length];main.innerHTML=`<div class="eyebrow">Il tuo gusto, il tuo menu</div><h1 class="h1">Quali ricette ti ispirano?</h1><p class="sub">Valuta queste proposte: useremo i tuoi sì e i tuoi no per affinare il piano settimanale.</p><div class="panel swipearea"><div class="recipehero">${recipeDetailData(r)?.image?`<img class="recipephoto" src="${safe(recipeDetailData(r).image)}" alt="${safe(r.name)}" loading="lazy" onerror="this.style.display='none'">`:`<span class="recipeemoji">${r.emoji}</span>`}</div><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:17px"><div><h2 style="margin:0;font-size:23px;letter-spacing:-.6px">${r.name}</h2><div class="recipemeta"><span>◷ ${r.time??'n.d.'} min</span><span>♨ ${recipeDetailData(r)?.kcal??'n.d.'} kcal</span></div></div>${r.stili.length?`<span class="daytag">${safe(r.stili.filter(s=>state.styles.includes(s)).concat(r.stili.filter(s=>!state.styles.includes(s))).slice(0,2).join(' · '))}</span>`:''}</div><div class="hint" style="margin-top:12px">${r.ings.join(' · ')}</div><div class="swipebuttons"><button class="roundbtn" aria-label="Non mi piace" onclick="rateRecipe(${r.id},false)">✕</button><button class="roundbtn like" aria-label="Mi piace" onclick="rateRecipe(${r.id},true)">♥</button></div><div class="counter">${Math.min(state.swipeIndex+1,pool.length)} di ${Math.min(10,pool.length)} · ${state.likes.length} preferite</div><div class="footer"><button class="btn" onclick="state.view='onboard';state.step=8;render()">← Indietro</button><button class="btn primary" onclick="finishSwipe()">${state.swipeIndex>=Math.min(10,pool.length)-1?'Crea il mio piano →':'Salta e continua →'}</button></div></div>`}
function rateRecipe(id,yes){(yes?state.likes:state.dislikes).push(id);state.swipeIndex++;let pool=tinderRecipes();if(state.swipeIndex>=Math.min(10,pool.length)){finishSwipe()}else render()}
function finishSwipe(){
 // Il Tinder conclude l'onboarding e registra i gusti: la generazione del piano è separata.

 generateWeeklyPlan();

function recipePreferenceScore(r){
 const saved=(state.favorites||[]).map(id=>recipeData.find(x=>x.id===id)).filter(Boolean);
 const liked=(state.likes||[]).map(id=>recipeData.find(x=>x.id===id)).filter(Boolean);
 const positive=[...new Map([...saved,...liked].map(x=>[x.id,x])).values()];
 const matchingIngredients=new Set();
 positive.forEach(x=>x.ings.forEach(i=>matchingIngredients.add(i)));
 const related=positive.filter(x=>x.id!==r.id);
 const styleMatches=related.filter(x=>x.stili.some(s=>r.stili.includes(s))).length;
 const ingredientMatches=r.ings.filter(i=>matchingIngredients.has(i)).length;
 return (state.likes.includes(r.id)?3:0)+
        (state.favorites.includes(r.id)?4:0)+
        Math.min(2,styleHits(r))*1.5+// stili scelti nell'onboarding (app/stili.py)
        Math.min(3,styleMatches)*0.6+Math.min(3,ingredientMatches)*0.35;
}

// o campi non presenti, senza trasferire macro di una variante a un'altra.

function sourceRank(r){const source=(recipeDetailData(r)?.source||'').toLowerCase();return source.includes('giallozafferano')?0:secondarySources.some(x=>source.includes(x.toLowerCase()))?1:2}
function requestedSlots(){const result=[];for(let d=0;d<7;d++)for(const meal of ['Pranzo','Cena'])if((meal==='Pranzo'&&state.meals!=='dinner'&&state.lunch.includes(d))||(meal==='Cena'&&state.meals!=='lunch'&&state.dinner.includes(d)))result.push(`${d}-${meal}`);return result}
// Piano settimanale: estrazione casuale pesata su tutto il catalogo compatibile.
// Le ricette che piacciono (cuoricino, preferiti, stili, ingredienti simili) hanno
// più probabilità di uscire, ma non sono fisse; i «no» sono sempre esclusi.
function rankedPool(excludeId=null){
 if(state.planSeed==null)state.planSeed=newSeed();
 const seed=state.planSeed;
 return planRecipes().filter(r=>!state.dislikes.includes(r.id)&&r.id!==excludeId)
  .map(r=>({r,k:Math.pow(seededRandom(seed,r.id),1/Math.exp(0.9*Math.max(0,recipePreferenceScore(r))))}))
  .sort((a,b)=>b.k-a.k).map(x=>x.r);
}
function generateWeeklyPlan(){

 // Gli ID sono unici nell'intera settimana, incluso pranzo/cena dello stesso giorno.
 // Varietà: a ogni pasto si preferisce il tipo di piatto usato meno finora.
 const used=new Set();const typeCount={};
 for(const slot of slots){
  const free=candidates.filter(r=>!used.has(r.id));if(!free.length)break;
  const least=Math.min(...free.map(r=>typeCount[r.type]||0));
  const next=free.find(r=>(typeCount[r.type]||0)===least)||free[0];
  plan[slot]=next.id;used.add(next.id);typeCount[next.type]=(typeCount[next.type]||0)+1;
 }
 state.plan=plan;state.planMissing=slots.length-used.size;state.replacementHistory={};
}

function flyerPeriod(v){if(!v)return'';if(v.valido_dal&&v.valido_al)return'dal '+fmtDay(v.valido_dal)+' al '+fmtDay(v.valido_al);if(v.valido_dal)return'dal '+fmtDay(v.valido_dal);return'aggiornato oggi'}
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return''}};
function openUrl(u){if(!u)return;const w=window.open(u,'_blank','noopener');if(!w)location.href=u}
function flyerInfo(tg){const extra=tg.next?`<div class="notice">🆕 Il prossimo volantino è già pubblicato: valido ${flyerPeriod(tg.next)}.${tg.next.url!==tg.url?` <button class="btn" style="display:block;margin-top:10px" onclick="openUrl(${JSON.stringify(tg.next.url).replace(/"/g,'&quot;')})">Apri il prossimo ↗</button>`:''}</div>`:'';
 const body=tg.direct?`<p>Ho aperto il volantino in corso${tg.v.titolo?': <strong>'+safe(tg.v.titolo)+'</strong>':''} · valido ${flyerPeriod(tg.v)}.${tg.v.scegli_negozio?' Sulla pagina ufficiale seleziona il tuo punto vendita per sfogliarlo.':''}</p>`:tg.byStore?`<p>${safe(tg.name)} pubblica offerte diverse per zona e punto vendita: nella pagina ufficiale dei volantini scegli il tuo negozio e trovi l'ultimo volantino pubblicato.</p>`:`<p>Ho aperto la pagina ufficiale dei volantini di ${safe(tg.name)}, che mostra sempre l'ultimo pubblicato.</p>`;
 const upd=flyerData&&flyerData.aggiornato_il?' · controllato il '+fmtDay(flyerData.aggiornato_il.slice(0,10)):'';
 return `<div class="modalhead"><h2>📰 Volantino ${safe(tg.name)}</h2><button class="close" onclick="closeModal()">✕</button></div>${body}<button class="btn primary" onclick="openUrl(${JSON.stringify(tg.url).replace(/"/g,'&quot;')})">${tg.direct?'Apri di nuovo il volantino ↗':'Apri i volantini ufficiali ↗'}</button>${extra}<p class="hint" style="margin-top:12px">Fonte: sito ufficiale ${safe(hostOf(flyerPages[tg.name]||tg.url))}${upd}.</p>`}
function openFlyer(){const stores=state.stores.map(storeName);
 if(!stores.length){modal(`<div class="modalhead"><h2>Scegli un supermercato</h2><button class="close" onclick="closeModal()">✕</button></div><p>Non hai selezionato un supermercato durante l'onboarding.</p><button class="btn primary" onclick="closeModal();openSettings()">Apri preferenze</button>`);return}
 if(stores.length===1){openFlyerFor(0);return}
 modal(`<div class="modalhead"><div><div class="eyebrow">Volantini</div><h2 style="margin:0">Scegli il supermercato</h2></div><button class="close" onclick="closeModal()">✕</button></div><p class="sub">Si apre sempre l'ultimo volantino ufficiale.</p>${stores.map((s,i)=>{const tg=flyerTarget(s);return`<button class="cartday" onclick="openFlyerFor(${i})"><span>🏪 &nbsp;${safe(s)}<small style="display:block;opacity:.7;font-weight:500;margin-top:2px">${tg.direct?'Volantino '+flyerPeriod(tg.v):tg.byStore?'Scegli il tuo punto vendita':'Pagina volantini ufficiale'}</small></span><span>↗</span></button>`}).join('')}`)}
function openFlyerFor(i){const s=state.stores[i];if(s===undefined)return;const tg=flyerTarget(s);openUrl(tg.url);modal(flyerInfo(tg))}
function openSettings(){modal(`<div class="modalhead"><h2>⚙ Le tue preferenze</h2><button class="close" onclick="closeModal()">✕</button></div><p>Per modificare le impostazioni puoi riaprire l'onboarding con il pulsante qui sotto. Le preferenze correnti sono conservate su questo dispositivo.</p><div class="ingredientrow"><span>Supermercati</span><strong style="margin-left:auto">${state.stores.join(', ')||'Nessuno'}</strong></div><div class="ingredientrow"><span>Budget</span><strong style="margin-left:auto">€ ${state.budget}</strong></div><div class="ingredientrow"><span>Persone</span><strong style="margin-left:auto">${state.people}</strong></div><div class="ingredientrow"><span>Dieta</span><strong style="margin-left:auto">${state.diet}</strong></div><div class="ingredientrow"><span>Ingredienti esclusi</span><strong style="margin-left:auto">${state.avoid.length}</strong></div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:18px"><button class="btn" onclick="exportCheffinoBackup()">↓ Esporta backup</button><button class="btn" onclick="document.getElementById('cheffinoBackupInput').click()">↑ Importa backup</button></div><div class="notice">Il backup contiene piano, preferenze e preferiti. Conservalo nell’app File dell’iPhone.</div><button class="btn primary" style="margin-top:18px" onclick="closeModal();state.view='onboard';state.step=0;render()">Modifica onboarding</button>`)}
function exportCheffinoBackup(){
  persist();
  const payload={application:'pepito',backupVersion:1,exportedAt:new Date().toISOString(),state};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='pepito-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
}
async function importCheffinoBackup(input){
  const file=input.files&&input.files[0];if(!file)return;
  try{const payload=JSON.parse(await file.text());
    if(!['pepito','cheffino'].includes(payload.application)||payload.backupVersion!==1||!payload.state||typeof payload.state!=='object'||Array.isArray(payload.state))throw Error('File non riconosciuto');
    if(!confirm('Vuoi sostituire il piano e le preferenze correnti con questo backup?'))return;
    const restored={...defaults,...payload.state};if(Array.isArray(restored.stores))restored.stores=[...new Set(restored.stores.map(x=>x==='Dec'?'Decò':x))];
    if(!Array.isArray(restored.favorites)||!Array.isArray(restored.likes)||!Array.isArray(restored.dislikes)||!Array.isArray(restored.stores))throw Error('Backup non valido');
    state=restored;persist();closeModal();render();alert('Backup importato correttamente.');
  }catch(e){alert('Impossibile importare il backup: '+e.message)}finally{input.value=''}
}

// Il catalogo pubblicato su Render è la fonte dati primaria. Le schede locali
// rimangono come fallback se l'API non risponde (es. sviluppo offline).
async function caricaCatalogoServer(){
 try{
  const response=await fetch('/api/recipes',{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const payload=await response.json();
  if(!Array.isArray(payload.recipes))throw new Error('Formato catalogo non valido');
  catalogTotal=payload.recipes.length;
  recipeData.length=0;
  catalogBrowse.length=0;
  Object.keys(sourcedDetails).forEach(id=>delete sourcedDetails[id]);
  for(const entry of payload.recipes){
   if(typeof entry.id!=='number'||!entry.name||!entry.url||!/^https:\/\//.test(entry.url)||!entry.source)continue;
   const ingredients=Array.isArray(entry.ingredients)?entry.ingredients:[];
   const steps=Array.isArray(entry.steps)?entry.steps:[];
   const review=Boolean(entry.needs_review||entry.validazione_automatica?.approved===false||!ingredients.length||!steps.length);
   const item={id:entry.id,name:entry.name,emoji:entry.emoji||'🍽️',
    time:entry.time??null,kcal:entry.kcal??null,
    ings:ingredients.map(x=>Array.isArray(x)?x[0]:'').filter(Boolean),
    stili:Array.isArray(entry.stili)?entry.stili:[],style:(Array.isArray(entry.stili)&&entry.stili[0])||'',type:entry.type||'Piatto unico',
    autoValidated:!!entry.validazione_automatica?.approved,
    requiredTools:entry.validazione_automatica?.tools||[],review};
   catalogBrowse.push(item);
   sourcedDetails[entry.id]={source:entry.source,url:entry.url,
    servings:entry.servings||null,minutes:entry.time??null,kcal:entry.kcal??null,
    cost:entry.cost??null,protein:entry.protein??null,carbs:entry.carbs??null,fats:entry.fats??null,
    image:(entry.copertina_verifica?.esito==='segnaposto_senza_alternativa'
       ?((entry.step_images_display||entry.step_images||[]).flat().find(u=>!/strip/i.test(u))||null)
       :entry.image_url)||null,ingredients,steps,stepImages:entry.step_images_display||entry.step_images||[],
    photoAbsent:entry.step_photo_source_evidence?.status==='verified_absent',
    diets:entry.diete?.compatibilita||{},dietReasons:entry.diete?.motivi||{},deduced:entry.quantita_dedotte||[]};
   if(!review)recipeData.push(item);
  }
  // Elimina solo i riferimenti a vecchie demo ormai inesistenti.
  const validIds=new Set(recipeData.map(x=>x.id));
  for(const key of ['favorites','likes','dislikes'])state[key]=(state[key]||[]).filter(id=>validIds.has(id));
  const old=state.plan||{};
  state.plan=Object.fromEntries(Object.entries(old).filter(([key,id])=>validIds.has(id)));
  state.replacementHistory={};
  delete state.verifiedOnly;
  if(state.view==='home' && (Object.keys(state.plan).length===0 || requestedSlots().some(k=>!Object.hasOwn(state.plan,k)))){
   generateWeeklyPlan();
  }
  catalogError='';
  console.info('Pepito: ricette con fonte disponibili:',recipeData.length);
 }catch(e){
  catalogError=e.message;
  console.error('Pepito: impossibile recuperare il catalogo con fonte',e);
 }finally{
  catalogLoading=false;
  if(catalogError){document.getElementById('main').innerHTML=`<section class="panel"><h2>Catalogo temporaneamente non disponibile</h2><p>Non mostro ricette dimostrative. Controlla la connessione e riprova.</p><button class="btn primary" onclick="catalogLoading=true;render();caricaCatalogoServer()">Riprova</button></section>`;}else render();
 }
}
render();
caricaCatalogoServer();
caricaVolantini();
// Service worker: l'app si apre subito con le ricette salvate e funziona senza rete;
// quando arrivano dati nuovi si aggiorna da sola.
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='127.0.0.1')){
 navigator.serviceWorker?.register('/sw.js').catch(()=>{});
 navigator.serviceWorker?.addEventListener('message',e=>{const p=e.data&&e.data.type==='dati-aggiornati'&&e.data.path;if(p==='/api/recipes')caricaCatalogoServer();else if(p==='/api/volantini')caricaVolantini()});
}

</script></body></html>
