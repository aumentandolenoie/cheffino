function filteredRecipes(options={}){
 const meat=['Pollo','Carne bovina','Tacchino','Salmone','Tonno','Merluzzo','Pesce spada','Carne di maiale','Salsiccia','Gamberi','Pancetta','Prosciutto cotto','Prosciutto crudo','Orata','Branzino','Calamari','Seppie','Vongole','Cozze','Sgombro','Acciughe','Bresaola','Speck','Mortadella','Wurstel','Vitello','Agnello','Cosce di pollo','Petto di pollo','Lombo di maiale'];
 const animal=['Uova','Formaggio','Grana','Ricotta','Feta','Mozzarella','Yogurt','Burro','Latte','Panna','Parmigiano','Pecorino','Crescenza','Stracchino','Scamorza','Provola','Fontina','Gorgonzola','Taleggio','Miele'];
 const gluten=['Pasta','Pasta integrale','Pane','Piadine','Cous cous','Gnocchi','Pane grattugiato','Pangrattato','Farro','Orzo','Bulgur','Bulgur','Noodles','Bulgur'];
 const dairy=['Ricotta','Formaggio','Grana','Feta','Mozzarella','Yogurt','Burro','Latte','Panna','Parmigiano','Pecorino','Crescenza','Stracchino','Scamorza','Provola','Fontina','Gorgonzola','Taleggio'];
 const diets=Array.isArray(state.diet)?state.diet:[state.diet];
 return recipeData.filter(r=>{
  // Le schede approvate automaticamente non certificano allergeni o diete.
  // In presenza di esigenze alimentari specifiche non mostrarle come sicure.
  if(r.autoValidated){
   if(diets.some(d=>d!=='Nessuna'))return false;
   if(!r.requiredTools.length || r.requiredTools.some(t=>!state.kitchen.includes(t)))return false;
  }

  if(r.ings.some(i=>state.avoid.includes(i)))return false;
   const sourceIngs=recipeDetailData(r)?.ingredients.map(i=>i[0].toLowerCase())||[];
   const fold=(x)=>String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
   if(state.avoid.some(a=>sourceIngs.some(i=>{
     const ing=fold(i), excluded=fold(a);
     return ing===excluded || ing.startsWith(excluded+' ') || ing.endsWith(' '+excluded) || ing.includes(' '+excluded+' ');
   })))return false;

  if(diets.includes('Vegano')&&(r.ings.some(i=>[...meat,...animal].includes(i))||sourceIngs.some(i=>/(pollo|uova|grana|parmigiano|panna|burro|latte|formaggio|miele|pesce|carne)/i.test(i))))return false;
  if(diets.includes('Vegetariano')&&(r.ings.some(i=>meat.includes(i))||sourceIngs.some(i=>/(pollo|petto di pollo|pancetta|carne|salmone|tonno|merluzzo)/i.test(i))))return false;
  if(diets.includes('Senza Glutine')&&(r.ings.some(i=>gluten.includes(i))||sourceIngs.some(i=>/(pasta|ditalini|farina 00|grano|pane)/i.test(i))))return false;
  if(diets.includes('Senza Lattosio')&&(r.ings.some(i=>dairy.includes(i)&&!['Ricotta senza lattosio','Yogurt senza lattosio'].includes(i))||sourceIngs.some(i=>/(grana|parmigiano|panna|burro|latte|formaggio)/i.test(i))))return false;
  if(!options.relaxStyles&&state.styles.length&&!state.styles.includes(r.style))return false;
  if(state.types.length){const allowed=[];if(state.types.includes('Primo'))allowed.push('Primo');if(state.types.includes('Secondo'))allowed.push('Secondo');if(state.types.includes('Piatto Unico'))allowed.push('Piatto unico');if(state.types.includes('Primo e Secondo'))allowed.push('Primo','Secondo');if(!allowed.includes(r.type))return false;}
  if((r.name.toLowerCase().includes('forno')||r.name.toLowerCase().includes('al forno'))&&!state.kitchen.includes('Forno'))return false;
  if(!state.kitchen.length)return false;
  return true;
 });
}

function recipePreferenceScore(r){
 const saved=(state.favorites||[]).map(id=>recipeData.find(x=>x.id===id)).filter(Boolean);
 const liked=(state.likes||[]).map(id=>recipeData.find(x=>x.id===id)).filter(Boolean);
 const positive=[...new Map([...saved,...liked].map(x=>[x.id,x])).values()];
 const matchingIngredients=new Set();
 positive.forEach(x=>x.ings.forEach(i=>matchingIngredients.add(i)));
 const related=positive.filter(x=>x.id!==r.id);
 const styleMatches=related.filter(x=>x.style===r.style).length;
 const ingredientMatches=r.ings.filter(i=>matchingIngredients.has(i)).length;
 return (state.likes.includes(r.id)?3:0)+
        (state.favorites.includes(r.id)?4:0)+
        (state.styles.includes(r.style)?1:0)+
        Math.min(3,styleMatches)*0.6+Math.min(3,ingredientMatches)*0.35;
}
// Priorità: GialloZafferano; fonti alternative soltanto per schede aggiuntive
// o campi non presenti, senza trasferire macro di una variante a un'altra.
const secondarySources=['Il Cucchiaio d’Argento','Tavolartegusto','Cucina Botanica','Cookist'];
function sourceRank(r){const source=(recipeDetailData(r)?.source||'').toLowerCase();return source.includes('giallozafferano')?0:secondarySources.some(x=>source.includes(x.toLowerCase()))?1:2}
function requestedSlots(){const result=[];for(let d=0;d<7;d++)for(const meal of ['Pranzo','Cena'])if((meal==='Pranzo'&&state.meals!=='dinner'&&state.lunch.includes(d))||(meal==='Cena'&&state.meals!=='lunch'&&state.dinner.includes(d)))result.push(`${d}-${meal}`);return result}
function rankedPool(excludeId=null){
 return planRecipes().filter(r=>!state.dislikes.includes(r.id)&&r.id!==excludeId)
  .sort((a,b)=>sourceRank(a)-sourceRank(b)||recipePreferenceScore(b)-recipePreferenceScore(a)||a.id-b.id);
}
function generateWeeklyPlan(){
 const candidates=rankedPool();const slots=requestedSlots();const plan={};
 // Gli ID sono unici nell'intera settimana, incluso pranzo/cena dello stesso giorno.
 const offset=candidates.length?(state.planGeneration||0)%candidates.length:0;
 const rotated=candidates.slice(offset).concat(candidates.slice(0,offset));
 const used=new Set();
 for(const slot of slots){const next=rotated.find(r=>!used.has(r.id));if(next){plan[slot]=next.id;used.add(next.id)}}
 state.plan=plan;state.planMissing=slots.length-used.size;state.replacementHistory={};
}

;margin:0">Le tue ricette settimanali</h2></div><button class="btn" onclick="regenerateAll()">↻ Rigenera piano</button></div><div class="notice">📚 Solo ricette provenienti da fonti pubblicate · ${recipeData.length} disponibili nel catalogo. ${catalogError?'Il server non è raggiungibile: riprova ad aggiornare la pagina.':''}</div><div class="tabrow">${(state.meals!=='dinner'?`<button class="tab ${state.tab==='Pranzo'?'active':''}" onclick="setTab('Pranzo')">☀️ Pranzo</button>`:'')}${(state.meals!=='lunch'?`<button class="tab ${state.tab==='Cena'?'active':''}" onclick="setTab('Cena')">🌙 Cena</button>`:'')}</div><div class="recipegrid weekly-recipes-grid">${renderRecipeCards()}</div>${renderSavedSection()}<div class="notice">Le ricette provengono esclusivamente dal catalogo con fonti. Valori nutrizionali e prezzi mancanti sono indicati come non disponibili; il budget non è ancora ottimizzato sui prezzi locali.</div>`}
function renderRecipeCards(){const list=[];days.forEach((d,i)=>{const key=`${i}-${state.tab}`;if(state.plan[key]!==undefined){const r=getRecipe(state.plan[key]);list.push(`<article class="recipecard" onclick="if(!event.target.closest('button'))showRecipe(${r.id})"><div class="thumb" role="button" tabindex="0" onclick="showRecipe(${r.id})" onkeydown="if(event.key==='Enter')showRecipe(${r.id})">${recipeDetailData(r)?.image?`<img class="thumbphoto" src="${safe(recipeDetailData(r).image)}" alt="${safe(r.name)}" loading="lazy" onerror="this.style.display='none'">`:r.emoji}</div><div><div class="cardtop"><span class="daytag">${d}</span><button class="iconbtn" title="Salva nei preferiti" onclick="toggleFavorite(${r.id})">${state.favorites.includes(r.id)?'♥':'♡'}</button></div><h3 onclick="showRecipe(${r.id})">${r.name}</h3><div class="cardmeta">◷ ${r.time??'n.d.'} min &nbsp;·&nbsp; ${recipeDetailData(r)?.kcal??'n.d.'} kcal</div><div class="cardactions"><button class="smallbtn" onclick="showRecipe(${r.id})">Vedi ricetta</button><button class="iconbtn" title="Cambia ricetta" onclick="replaceRecipe(${i},'${state.tab}')">↻</button></div></div></article>`)}});days.forEach((day,i)=>{const key=`${i}-${state.tab}`;if(requestedSlots().includes(key)&&state.plan[key]===undefined)list.push(`<article class="recipecard"><div class="thumb">📖</div><div><span class="daytag">${day}</span><h3>Ricetta da trovare</h3><div class="cardmeta">Nessuna ricetta diversa e compatibile disponibile</div></div></article>`)});return list.length?list.join(''):'<div class="empty" style="grid-column:1/-1">Nessun pasto selezionato per questa sezione.<br>Puoi modificare i giorni nelle preferenze.</div>'}

function setTab(t){state.tab=t;render()}function toggleFavorite(id){const expanded=!!document.querySelector('.saved-modal-grid');state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];render();if(expanded)showAllSaved()}
function replaceRecipe(day,meal){
 const key=`${day}-${meal}`, current=state.plan[key];
 // Mai riciclare una ricetta già assegnata a un altro pasto.
 const alreadyUsed=new Set(Object.entries(state.plan).filter(([k])=>k!==key).map(([,id])=>id));
 const pool=rankedPool(current).filter(r=>!alreadyUsed.has(r.id));
 if(!pool.length){modal('<div class="modalhead"><h2>Nessuna alternativa diversa disponibile</h2><button class="close" onclick="closeModal()">✕</button></div><p>Le altre ricette compatibili sono già utilizzate nella settimana oppure non rispettano le tue esigenze. Non sostituisco il piatto con un duplicato: prova ad ampliare il catalogo o le preferenze.</p>');return}
 state.replacementHistory??={};
 const seen=state.replacementHistory[key]||(state.replacementHistory[key]=[]);
 let available=pool.filter(r=>!seen.includes(r.id));
 if(!available.length){state.replacementHistory[key]=[];available=pool}
 const next=available[0];state.replacementHistory[key].push(next.id);
 state.plan[key]=next.id;render();
}

function showRecipe(id){const r=getRecipe(id),d=recipeDetailData(r),people=peopleCount();
 const metric=(title,val)=>`<div class="detailmetric"><span>${title}</span><b>${val}</b></div>`;
 const mac=(klass,title,key)=>`<div class="detailmacro ${klass}"><span>${title}</span><b>${typeof d?.[key]==='number'?d[key].toLocaleString('it-IT')+' g':'n.d.'}</b></div>`;
 const steps=d?`<ol class="detailsteps">${d.steps.map((x,i)=>{
   const images=Array.isArray(d.stepImages?.[i])?[...new Set(d.stepImages[i])]:[];
   return `<li><div>${safe(x)}</div>${images.length?`<div class="step-photo-grid">${images.map((url,j)=>
     `<img src="${safe(url)}" alt="${safe(r.name)} - foto passaggio ${i+1}.${j+1}" loading="lazy" decoding="async" referrerpolicy="no-referrer" style="aspect-ratio:auto;object-fit:contain;height:auto" onerror="this.remove()">`).join('')}</div>`:''}</li>`;
 }).join('')}</ol>`:'<p class="hint">Procedimento non ancora verificato per questa ricetta. Nessun passaggio viene inventato.</p>';

 modal(`<div class="modalhead"><h2 style="margin:0">${safe(r.name)}</h2><button class="close" onclick="closeModal()">✕</button></div>
 <div class="detailhero">${d?.image?`<img src="${safe(d.image)}" alt="${safe(r.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">`:''}<span class="foodart" style="${d?.image?'display:none':''}">${r.emoji}</span>${!d?.image?'<small>Foto non ancora verificata</small>':''}</div>
 <div class="detailmetrics">${metric('Persone',people)}${metric('Tempo',d?.minutes?d.minutes+' min':'n.d.')}${metric('Calorie',d?.kcal?d.kcal+' kcal/porz.':'n.d.')}${metric('Costo',d?.cost||'n.d.')}</div>
 <div class="detailmacros">${mac('protein','Proteine','protein')}${mac('carbs','Carboidrati','carbs')}${mac('fats','Grassi','fats')}</div>
 <h3>Ingredienti per ${people} ${people===1?'persona':'persone'}</h3>${ingredientRows(r)}
 <h3>Preparazione passo per passo</h3>${steps}
 ${d?`<a class="sourcebtn" href="${d.url}" target="_blank" rel="noopener noreferrer">Fonte: ${safe(d.source)} ↗</a>`:'<div class="notice">Scheda non verificata: le informazioni dettagliate verranno mostrate solo dopo l’acquisizione da una fonte affidabile.</div>'}
 <div class="notice">Kcal, tempi, costo e macronutrienti sono riportati solo se presenti nella fonte (il costo qualitativo non è un prezzo di vendita). Le quantità numeriche sono proporzionate dalle dosi originali, mentre “q.b.” resta invariato.</div>`)
}
function openCartDays(){let ds=chosenDays();modal(`<div class="modalhead"><div><div class="eyebrow">Lista della spesa</div><h2 style="margin:0">Scegli un giorno</h2></div><button class="close" onclick="closeModal()">✕</button></div><p class="sub" style="margin:8px 0 16px">Apri un giorno per vedere gli ingredienti raggruppati per pranzo e cena.</p>${ds.length?ds.map(i=>`<button class="cartday" onclick="showCartDay(${i})"><span>🗓️ &nbsp;${days[i]}</span><span>→</span></button>`).join(''):'<div class="empty">Non hai selezionato giorni per i pasti. Modifica le preferenze per creare la lista.'}<button class="btn primary" style="margin-top:14px" onclick="exportShoppingList()">↓ Esporta lista completa (.csv)</button><div class="notice">La lista utilizza le grammature dichiarate dalle fonti e proporziona le dosi alle persone selezionate. Prezzi di supermercato non disponibili.</div>`)}
function showCartDay(i){let html=`<div class="modalhead"><div><div class="eyebrow">Carrello della spesa</div><h2 style="margin:0">${days[i]}</h2></div><button class="close" onclick="openCartDays()">← Giorni</button></div>`;['Pranzo','Cena'].forEach(m=>{const id=state.plan[`${i}-${m}`];if(id===undefined)return;const r=getRecipe(id);html+=`<h3>${m==='Pranzo'?'☀️':'🌙'} ${m} · ${safe(r.name)}</h3>`+ingredientRows(r,true)});html+='<div class="notice">Quantità proporzionate dalle ricette con fonte verificata. Dove mancano fonti, le grammature non vengono inventate.</div>';modal(html)}
function exportShoppingList(){
 const entries=new Map();let missing=[];
 Object.entries(state.plan).forEach(([slot,id])=>{
  const r=getRecipe(id),d=recipeDetailData(r);
  if(!d){missing.push(r.name);return}
  const portion=peopleCount()/d.servings;
  d.ingredients.forEach(([name,qty,unit])=>{
   const key=name.toLowerCase().trim()+'|'+unit;
   const old=entries.get(key)||{name,qty:0,unit,unknown:false,meals:[]};
   if(qty===null)old.unknown=true;else old.qty+=qty*portion;
   old.meals.push(slot);entries.set(key,old);
  });
 });
 const csv=[['Ingrediente','Quantità totale','Unità','Pasti'].join(';'),...Array.from(entries.values()).sort((a,b)=>a.name.localeCompare(b.name,'it')).map(x=>[x.name,x.unknown?'q.b.':String(Number(x.qty.toFixed(2))).replace('.',','),x.unit,x.meals.join(' / ')].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';'))];
 if(missing.length)csv.push('"Ricette senza quantità verificate";"'+missing.join(', ').replaceAll('"','""')+'";;');
 const blob=new Blob(['\ufeff'+csv.join('\r\n')],{type:'text/csv;charset=utf-8'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cheffino-lista-spesa.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function openSettings(){modal(`<div class="modalhead"><h2>⚙ Le tue preferenze</h2><button class="close" onclick="closeModal()">✕</button></div><p>Per modificare le impostazioni puoi riaprire l'onboarding con il pulsante qui sotto. Le preferenze correnti sono conservate su questo dispositivo.</p><div class="ingredientrow"><span>Supermercati</span><strong style="margin-left:auto">${state.stores.join(', ')||'Nessuno'}</strong></div><div class="ingredientrow"><span>Budget</span><strong style="margin-left:auto">€ ${state.budget}</strong></div><div class="ingredientrow"><span>Persone</span><strong style="margin-left:auto">${state.people}</strong></div><div class="ingredientrow"><span>Dieta</span><strong style="margin-left:auto">${state.diet}</strong></div><div class="ingredientrow"><span>Ingredienti esclusi</span><strong style="margin-left:auto">${state.avoid.length}</strong></div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:18px"><button class="btn" onclick="exportCheffinoBackup()">↓ Esporta backup</button><button class="btn" onclick="document.getElementById('cheffinoBackupInput').click()">↑ Importa backup</button></div><div class="notice">Il backup contiene piano, preferenze e preferiti. Conservalo nell’app File dell’iPhone.</div><button class="btn primary" style="margin-top:18px" onclick="closeModal();state.view='onboard';state.step=0;render()">Modifica onboarding</button>`)}
function exportCheffinoBackup(){
  persist();
  const payload={application:'cheffino',backupVersion:1,exportedAt:new Date().toISOString(),state};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='cheffino-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
}
async function importCheffinoBackup(input){
  const file=input.files&&input.files[0];if(!file)return;
  try{const payload=JSON.parse(await file.text());
    if(payload.application!=='cheffino'||payload.backupVersion!==1||!payload.state||typeof payload.state!=='object'||Array.isArray(payload.state))throw Error('File non riconosciuto');
    if(!confirm('Vuoi sostituire il piano e le preferenze correnti con questo backup?'))return;
    const restored={...defaults,...payload.state};
    if(!Array.isArray(restored.favorites)||!Array.isArray(restored.likes)||!Array.isArray(restored.dislikes)||!Array.isArray(restored.stores))throw Error('Backup non valido');
    state=restored;persist();closeModal();render();alert('Backup importato correttamente.');
  }catch(e){alert('Impossibile importare il backup: '+e.message)}finally{input.value=''}
}

// Il catalogo pubblicato su Render è la fonte dati primaria. Le schede locali
// rimangono come fallback se l'API non risponde (es. sviluppo offline).
async function caricaCatalogoServer(){
 try{
  const response=await fetch('/api/recipes',{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const payload=await response.json();
  if(!Array.isArray(payload.recipes))throw new Error('Formato catalogo non valido');
  recipeData.length=0;
  Object.keys(sourcedDetails).forEach(id=>delete sourcedDetails[id]);
  for(const entry of payload.recipes){
   // Il server può conservare schede in revisione: non proporle ancora.
   if(entry.needs_review || entry.validazione_automatica?.approved===false)continue;
   if(typeof entry.id!=='number'||!entry.name||!entry.url||!/^https:\/\//.test(entry.url)||!entry.source||!Array.isArray(entry.ingredients)||!entry.ingredients.length)continue;
   if(!Array.isArray(entry.steps)||!entry.steps.length)continue;
   recipeData.push({id:entry.id,name:entry.name,emoji:entry.emoji||'🍽️',
    time:entry.time??null,kcal:entry.kcal??null,
    ings:entry.ingredients.map(x=>Array.isArray(x)?x[0]:'').filter(Boolean),
    style:entry.style||'Da classificare',type:entry.type||'Piatto unico',
    autoValidated:!!entry.validazione_automatica?.approved,
    requiredTools:entry.validazione_automatica?.tools||[]});
   sourcedDetails[entry.id]={source:entry.source,url:entry.url,
    servings:entry.servings||null,minutes:entry.time??null,kcal:entry.kcal??null,
    cost:entry.cost??null,protein:entry.protein??null,carbs:entry.carbs??null,fats:entry.fats??null,
    image:entry.image_url||null,ingredients:entry.ingredients,steps:entry.steps,stepImages:entry.step_images_display||entry.step_images||[]};
  }
  // Elimina solo i riferimenti a vecchie demo ormai inesistenti.
  const validIds=new Set(recipeData.map(x=>x.id));
  for(const key of ['favorites','likes','dislikes'])state[key]=(state[key]||[]).filter(id=>validIds.has(id));
  const old=state.plan||{};
  state.plan=Object.fromEntries(Object.entries(old).filter(([key,id])=>validIds.has(id)));
  state.replacementHistory={};
  delete state.verifiedOnly;
  if(state.view==='home' && (Object.keys(state.plan).length===0 || requestedSlots().some(k=>!Object.hasOwn(state.plan,k)))){
   generateWeeklyPlan();
  }
  catalogError='';
  console.info('Cheffino: ricette con fonte disponibili:',recipeData.length);
 }catch(e){
  catalogError=e.message;
  console.error('Cheffino: impossibile recuperare il catalogo con fonte',e);
 }finally{
  catalogLoading=false;
  if(catalogError){document.getElementById('main').innerHTML=`<section class="panel"><h2>Catalogo temporaneamente non disponibile</h2><p>Non mostro ricette dimostrative. Controlla la connessione e riprova.</p><button class="btn primary" onclick="catalogLoading=true;render();caricaCatalogoServer()">Riprova</button></section>`;}else render();
 }
}
render();
caricaCatalogoServer();
